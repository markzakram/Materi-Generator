<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Materi Cerebrum</title>
<style>
@font-face { font-family: "Poppins"; src: url("font/Poppins-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Poppins"; src: url("font/Poppins-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
/* Warna bawaan: palet JadiASN (ICON Aplikasi generator, catalog/brands.json). Warna tiap aplikasi (css di
   <aplikasi>/data.json, dari generator/palet.py) dipasang ke #tema-app saat tabnya dibuka. */
:root {
  --header: #052C5F; --header-aksen: #E8B41E; --header-redup: #C9D6E6;
  --kuning: #E8B41E; --kuning-teks: #052C5F;
  --bg: #F3F6FA; --kartu: #FFFFFF; --teks: #0E2440; --redup: #46597A; --samar: #7D8CA3; --garis: #DDE4EE;
  --sorot: #E8EFF7; --aksen: #052C5F; --aksen-teks: #FFFFFF; --fokus: #3D6E99; --pilih: #3D6E99;
  --pdf-bg: #E8B41E; --pdf-teks: #052C5F; --pdf-garis: #E8B41E;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #031C3D; --kartu: #0A2A52; --teks: #E9EFF7; --redup: #B5C3D6; --garis: #1C3F6B; --sorot: #0F335F;
    --aksen: #E8B41E; --aksen-teks: #052C5F; --fokus: #E8B41E; --pilih: #E8B41E;
    --pdf-bg: transparent; --pdf-teks: #E8B41E;
  }
}
:root[data-theme="dark"] {
  --bg: #031C3D; --kartu: #0A2A52; --teks: #E9EFF7; --redup: #B5C3D6; --garis: #1C3F6B; --sorot: #0F335F;
  --aksen: #E8B41E; --aksen-teks: #052C5F; --fokus: #E8B41E; --pilih: #E8B41E;
  --pdf-bg: transparent; --pdf-teks: #E8B41E;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--teks); font: 400 14px/1.55 "Poppins", system-ui, sans-serif; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--fokus); outline-offset: 2px; }

.atas { background: var(--header); color: #fff; }
.atas-isi { max-width: 1240px; margin: 0 auto; padding: 22px 16px 26px; }
.merek { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 13px; letter-spacing: .04em;
  text-transform: uppercase; color: var(--header-aksen); }
.merek i { width: 22px; height: 22px; border-radius: 50%; background: var(--header-aksen); position: relative; display: inline-block; }
.merek i::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--header); }
h1 { margin: 10px 0 4px; font-size: 30px; line-height: 1.2; }
.atas p { margin: 0; color: var(--header-redup); max-width: 70ch; }

main { max-width: 1240px; margin: 0 auto; padding: 0 16px 56px; }
.alat { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 16px 0 12px; display: grid; gap: 12px; }
.baris-alat { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.label { font-size: 12px; font-weight: 700; color: var(--redup); }
.tema { display: flex; gap: 8px; flex-wrap: wrap; }
.tema label { position: relative; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 5px 14px 5px 5px;
  background: var(--kartu); border: 1px solid var(--garis); border-radius: 12px; }
.tema input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.tema img { width: 64px; aspect-ratio: 16 / 11.25; object-fit: cover; border-radius: 7px; display: block; background: var(--sorot); }
.tema span { font-weight: 700; font-size: 13px; color: var(--redup); }
.tema label:has(input:checked) { border-color: var(--pilih); box-shadow: inset 0 0 0 1px var(--pilih); }
.tema label:has(input:checked) span { color: var(--teks); }
.tema label:has(input:focus-visible) { outline: 3px solid var(--fokus); outline-offset: 2px; }
input[type=search] { flex: 1 1 260px; min-width: 0; border: 1px solid var(--garis); background: var(--kartu); color: var(--teks);
  border-radius: 999px; padding: 9px 16px; font: inherit; }
.jenis { display: inline-flex; background: var(--kartu); border: 1px solid var(--garis); border-radius: 999px; padding: 3px; }
.jenis label { position: relative; cursor: pointer; border-radius: 999px; padding: 6px 14px; display: flex; align-items: center; gap: 7px;
  font-weight: 700; font-size: 13px; line-height: 1.4; color: var(--redup); white-space: nowrap; }
.jenis input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.jenis b { font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; }
.jenis label:has(input:checked) { background: var(--aksen); color: var(--aksen-teks); }
.jenis label:has(input:focus-visible) { outline: 3px solid var(--fokus); outline-offset: 2px; }
.kelompok-saring { display: flex; gap: 6px; flex-wrap: wrap; }
.kelompok-saring button { border: 1px solid var(--garis); background: var(--kartu); color: var(--redup); border-radius: 999px;
  padding: 5px 12px; font: 700 12px/1.4 "Poppins", sans-serif; cursor: pointer; }
.kelompok-saring button[aria-pressed="true"] { background: var(--kuning); border-color: var(--kuning); color: var(--kuning-teks); }

h2 { font-size: 18px; margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
h2 span { font-size: 12px; font-weight: 700; color: var(--redup); background: var(--sorot); border-radius: 999px; padding: 2px 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 16px; }
.kartu { background: var(--kartu); border: 1px solid var(--garis); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.sampul { aspect-ratio: 16 / 11.25; background: var(--sorot); display: block; width: 100%; object-fit: cover; border-bottom: 1px solid var(--garis); }
.isi { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.isi h3 { margin: 0; font-size: 16px; line-height: 1.3; }
.meta { font-size: 12px; color: var(--redup); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.meta a { color: var(--redup); }
.unduh { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; padding-top: 6px; }
.tombol { display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; border-radius: 12px;
  padding: 8px 6px; font-weight: 700; font-size: 13px; line-height: 1.25; border: 1px solid transparent; }
.tombol small { font-weight: 400; font-size: 11px; opacity: .8; }
.tombol.pptx { background: var(--aksen); color: var(--aksen-teks); }
.tombol.pdf { background: var(--pdf-bg); color: var(--pdf-teks); border-color: var(--pdf-garis); }
.tombol[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.kosong { padding: 40px 0; text-align: center; color: var(--redup); }
.aplikasi { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
.aplikasi button { border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; border-radius: 999px;
  padding: 7px 16px; font: 700 13px/1.3 "Poppins", sans-serif; cursor: pointer; }
.aplikasi button:hover { background: rgba(255,255,255,.12); }
.aplikasi button[aria-selected="true"] { background: #fff; color: var(--header); border-color: #fff; }
/* HP: pilihan sampul dan pencarian ikut tergulir; hanya slicer dan kelompok (satu baris) yang menempel di atas. */
@media (max-width: 640px) {
  .alat { display: contents; }
  .alat > .baris-alat:first-child { padding-top: 16px; }
  #label-tema, #label-jenis { display: none; }
  .tema { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
  .tema label { padding-right: 8px; gap: 8px; }
  .tema img { width: 48px; }
  .tema span { font-size: 12px; line-height: 1.3; }
  input[type=search] { flex-basis: 100%; }
  .saringan { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; gap: 10px; }
  .jenis { display: grid; grid-template-columns: 1fr 1fr 1.35fr; width: 100%; }
  .jenis label { justify-content: center; padding: 8px 6px; }
  .kelompok-saring { flex-wrap: nowrap; overflow-x: auto; width: calc(100% + 32px); margin: 0 -16px; padding: 3px 16px; scrollbar-width: none; }
  .kelompok-saring::-webkit-scrollbar { display: none; }
  .kelompok-saring button { flex: none; padding: 7px 13px; }
  h2 { margin-top: 16px; scroll-margin-top: 120px; }
}
footer { max-width: 1240px; margin: 0 auto; padding: 0 16px 32px; font-size: 12px; color: var(--samar); }
</style>
<style id="tema-app"></style>
</head>
<body>
<header class="atas"><div class="atas-isi">
  <div class="aplikasi" role="tablist" aria-label="Pilih aplikasi" id="aplikasi"></div>
  <div class="merek"><i aria-hidden="true"></i><span id="merek">Cerebrum · Materi</span></div>
  <h1 id="judul">Materi</h1>
  <p id="ringkas">Memuat daftar materi…</p>
</div></header>
<main>
  <div class="alat">
    <div class="baris-alat">
      <span class="label" id="label-tema">Sampul</span>
      <div class="tema" role="radiogroup" aria-labelledby="label-tema" id="pilih-tema"></div>
      <input type="search" id="cari" placeholder="Cari judul…" aria-label="Cari judul materi atau contoh soal">
    </div>
    <div class="baris-alat saringan">
      <span class="label" id="label-jenis">Tampilkan</span>
      <div class="jenis" role="radiogroup" aria-labelledby="label-jenis" id="pilih-jenis"></div>
      <div class="kelompok-saring" id="kelompok" role="group" aria-label="Saring kelompok"></div>
    </div>
  </div>
  <div id="daftar"></div>
</main>
<footer id="kaki"></footer>

<script>
(() => {
  // Satu situs untuk semua aplikasi: aplikasi.json = daftar tab; <id>/data.json = materi, sampul,
  // ukuran berkas, dan warna halaman (css) aplikasi itu. Dibuat oleh generator/buat_situs.py.
  const $ = (id) => document.getElementById(id);
  const baca = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const tulis = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const mb = (b) => b == null ? "" : (b >= 1e6 ? (b / 1e6).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB");
  const ambil = (url) => fetch(url, { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
  const pesan = (teks) => { const p = document.createElement("p"); p.className = "kosong"; p.textContent = teks; $("daftar").replaceChildren(p); };

  const cache = {};
  let daftarApp = [], app = null, D = null, tema = null, kelompok = "", daftarKelompok = [];
  // Slicer jenis deck: "" (semua), "materi", atau "soal". Ikut di alamat (#tiu/soal) supaya bisa dibagikan.
  const JENIS = [["", "Semua"], ["materi", "Materi"], ["soal", "Contoh soal"]];
  let jenis = "";
  const jenisDeck = (m) => m.jenis || (/^Contoh Soal/.test(m.judul) ? "soal" : "materi");
  const sebut = (daftar) => {  // "17 materi · 11 contoh soal"
    const soal = daftar.filter((m) => jenisDeck(m) === "soal").length, materi = daftar.length - soal;
    return [materi && `${materi} materi`, soal && `${soal} contoh soal`].filter(Boolean).join(" · ");
  };
  const bacaAlamat = () => { const [id, j] = location.hash.slice(1).split("/"); return { id, jenis: JENIS.some(([k]) => k && k === j) ? j : "" }; };
  const tulisAlamat = () => { const h = "#" + app + (jenis ? "/" + jenis : ""); if (location.hash !== h) history.replaceState(null, "", h); };

  function slicer() {
    JENIS.forEach(([k, label]) => {
      const lab = document.createElement("label");
      const inp = document.createElement("input");
      inp.type = "radio"; inp.name = "jenis"; inp.value = k;
      inp.addEventListener("change", () => { jenis = k; tulisAlamat(); if (D) { gambar(); keAwal(); } });
      lab.append(inp, label, document.createElement("b"));
      $("pilih-jenis").append(lab);
    });
  }

  function keAwal() {  // setelah menyaring, mulai lagi dari awal daftar (di bawah bilah yang menempel)
    const bilah = document.querySelector(matchMedia("(max-width: 640px)").matches ? ".saringan" : ".alat");
    const y = $("daftar").getBoundingClientRect().top + scrollY - bilah.offsetHeight;
    if (scrollY > y) scrollTo({ top: y });
  }

  function tab() {
    const wadah = $("aplikasi");
    wadah.hidden = daftarApp.length < 2;
    daftarApp.forEach((a, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "tab"); b.id = "tab-" + a.id; b.textContent = a.nama;
      b.addEventListener("click", () => buka(a.id));
      b.addEventListener("keydown", (e) => {
        const arah = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (!arah) return;
        const lain = daftarApp[(i + arah + daftarApp.length) % daftarApp.length];
        buka(lain.id); $("tab-" + lain.id).focus();
      });
      wadah.append(b);
    });
  }

  async function buka(id) {
    if (!daftarApp.some((a) => a.id === id)) id = daftarApp[0].id;
    app = id;
    tulis("situs.aplikasi", id);
    tulisAlamat();
    daftarApp.forEach((a) => {
      const b = $("tab-" + a.id);
      b.setAttribute("aria-selected", String(a.id === id)); b.tabIndex = a.id === id ? 0 : -1;
    });
    let data;
    try {
      data = cache[id] || (cache[id] = await ambil(`${id}/data.json`));
    } catch {
      if (app === id) pesan("Daftar materi aplikasi ini belum tersedia.");
      return;
    }
    if (app !== id) return;  // tab lain sudah dipilih selama memuat
    D = data;
    $("tema-app").textContent = D.css || "";
    $("judul").textContent = D.judul; document.title = D.judul;
    $("merek").textContent = D.merek || "Cerebrum · Materi";
    const kunciTema = "situs.tema." + id;
    tema = D.tema.some((t) => t.id === baca(kunciTema)) ? baca(kunciTema) : D.tema[0].id;
    kelompok = "";
    const satuTema = D.tema.length < 2;
    const jumlah = sebut(D.materi).replace(" · ", " dan ");
    $("ringkas").textContent = satuTema
      ? `${jumlah}, siap diunduh dalam PPTX atau PDF.`
      : `${jumlah} dengan ${D.tema.length} pilihan sampul. Pilih sampul, lalu unduh PPTX atau PDF.`;
    $("label-tema").hidden = satuTema; $("pilih-tema").hidden = satuTema;
    const tgl = new Date(D.dibuat + "T00:00:00").toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
    $("kaki").textContent = `Diperbarui ${tgl}. © PT Cerebrum Edukanesia Nusantara.`;

    const pilih = $("pilih-tema"); pilih.replaceChildren();
    D.tema.forEach((t) => {
      const lab = document.createElement("label");
      const inp = document.createElement("input");
      inp.type = "radio"; inp.name = "tema"; inp.value = t.id; inp.checked = t.id === tema;
      inp.addEventListener("change", () => { tema = t.id; tulis(kunciTema, tema); gambar(); });
      const contoh = D.materi[0] && D.materi[0].tema[t.id];  // sampul materi pertama sebagai pratinjau
      const img = document.createElement("img");
      img.alt = ""; if (contoh) img.src = `${id}/${contoh.sampul}`;
      img.onerror = () => { img.removeAttribute("src"); };
      const s = document.createElement("span"); s.textContent = t.nama;
      lab.append(inp, img, s); pilih.append(lab);
    });
    daftarKelompok = [...new Set(D.materi.map((m) => m.kelompok))];
    const kel = $("kelompok"); kel.replaceChildren();
    ["", ...daftarKelompok].forEach((k) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = k || "Semua kelompok";
      b.addEventListener("click", () => { kelompok = k; gambar(); keAwal(); });
      kel.append(b);
    });
    gambar();
  }

  function tombol(jenis, t) {
    const a = document.createElement("a");
    a.className = "tombol " + jenis;
    a.href = `${app}/${t[jenis]}`;
    a.download = t.nama + "." + jenis;
    const ukuran = t["ukuran_" + jenis];
    if (ukuran == null) a.setAttribute("aria-disabled", "true");
    a.innerHTML = `Unduh ${jenis.toUpperCase()}<small></small>`;
    a.querySelector("small").textContent = ukuran == null ? "belum tersedia" : mb(ukuran);
    return a;
  }

  function gambar() {
    const cari = $("cari").value.trim().toLowerCase();
    const sejenis = (m) => !jenis || jenisDeck(m) === jenis;
    // kelompok yang tidak punya deck jenis ini disembunyikan
    if (kelompok && !D.materi.some((m) => m.kelompok === kelompok && sejenis(m))) kelompok = "";
    [...$("kelompok").children].forEach((b, i) => {
      const k = i === 0 ? "" : daftarKelompok[i - 1];
      b.setAttribute("aria-pressed", String(k === kelompok));
      b.hidden = k !== "" && !D.materi.some((m) => m.kelompok === k && sejenis(m));
    });
    const tersaring = D.materi.filter((m) => (!kelompok || m.kelompok === kelompok) &&
      (!cari || (m.judul + " " + m.bab + " " + m.kelompok).toLowerCase().includes(cari)));
    [...$("pilih-jenis").children].forEach((lab, i) => {  // angka di slicer mengikuti kelompok dan pencarian
      const k = JENIS[i][0];
      lab.querySelector("input").checked = k === jenis;
      lab.querySelector("b").textContent = tersaring.filter((m) => !k || jenisDeck(m) === k).length;
    });
    const cocok = tersaring.filter(sejenis);
    const wadah = $("daftar"); wadah.replaceChildren();
    if (!cocok.length) {
      const apa = jenis === "soal" ? "contoh soal" : jenis === "materi" ? "materi" : "materi atau contoh soal";
      pesan(`Tidak ada ${apa} yang cocok.` + (jenis && tersaring.length ? " Coba pilih Semua." : "")); return;
    }
    for (const k of daftarKelompok) {
      const isi = cocok.filter((m) => m.kelompok === k);
      if (!isi.length) continue;
      const h = document.createElement("h2"); h.textContent = k;
      const n = document.createElement("span"); n.textContent = sebut(isi); h.append(n);
      const grid = document.createElement("div"); grid.className = "grid";
      for (const m of isi) {
        const t = m.tema[tema];
        const kartu = document.createElement("article"); kartu.className = "kartu";
        const img = document.createElement("img");
        img.className = "sampul"; img.loading = "lazy"; img.alt = `Sampul ${m.judul}`;
        img.src = `${app}/${t.sampul}`;
        img.onerror = () => { img.removeAttribute("src"); };
        const isiKartu = document.createElement("div"); isiKartu.className = "isi";
        const h3 = document.createElement("h3"); h3.textContent = m.judul;
        const meta = document.createElement("div"); meta.className = "meta";
        meta.append(`${t.slide} slide`);
        if (m.dokumen) { const a = document.createElement("a"); a.href = m.dokumen; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Dokumen sumber ↗"; meta.append(" · ", a); }
        const unduh = document.createElement("div"); unduh.className = "unduh";
        unduh.append(tombol("pptx", t), tombol("pdf", t));
        isiKartu.append(h3, meta, unduh);
        kartu.append(img, isiKartu);
        grid.append(kartu);
      }
      wadah.append(h, grid);
    }
  }

  $("cari").addEventListener("input", () => { if (D) gambar(); });
  window.addEventListener("hashchange", () => {
    const tuju = bacaAlamat();
    if (!tuju.id || (tuju.id === app && tuju.jenis === jenis)) return;
    jenis = tuju.jenis;
    if (tuju.id !== app) buka(tuju.id); else if (D) gambar();
  });

  ambil("aplikasi.json").then((daftar) => {
    daftarApp = daftar;
    if (!daftarApp.length) { pesan("Belum ada materi. Jalankan generator/buat_situs.py."); return; }
    tab(); slicer();
    const tuju = bacaAlamat();
    jenis = tuju.jenis;
    buka(tuju.id || baca("situs.aplikasi") || daftarApp[0].id);
  }).catch(() => pesan("aplikasi.json tidak ditemukan. Jalankan generator/buat_situs.py."));
})();
</script>
</body>
</html>
