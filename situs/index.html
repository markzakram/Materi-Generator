<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Materi TIU Verbal</title>
<style>
@font-face { font-family: "Poppins"; src: url("font/Poppins-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Poppins"; src: url("font/Poppins-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
:root {
  --navy: #13215A; --kuning: #FBBB2B; --kuning-muda: #FFE6AE;
  --bg: #F4F6FB; --kartu: #FFFFFF; --teks: #1E2A4F; --redup: #4A5578; --samar: #8A93AD; --garis: #E3E7F0;
  --sorot: #EEF1F8; --aksen: #13215A; --aksen-teks: #FFFFFF; --fokus: #FBBB2B;
  --pdf-bg: #FBBB2B; --pdf-teks: #13215A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1330; --kartu: #152150; --teks: #E8ECF8; --redup: #B8C1DD; --garis: #26346E; --sorot: #1B2A5F;
    --aksen: #FBBB2B; --aksen-teks: #13215A; --pdf-bg: transparent; --pdf-teks: #FBBB2B;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1330; --kartu: #152150; --teks: #E8ECF8; --redup: #B8C1DD; --garis: #26346E; --sorot: #1B2A5F;
  --aksen: #FBBB2B; --aksen-teks: #13215A; --pdf-bg: transparent; --pdf-teks: #FBBB2B;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--teks); font: 400 14px/1.55 "Poppins", system-ui, sans-serif; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--fokus); outline-offset: 2px; }

.atas { background: #13215A; color: #fff; }
.atas-isi { max-width: 1240px; margin: 0 auto; padding: 22px 16px 26px; }
.merek { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 13px; letter-spacing: .04em;
  text-transform: uppercase; color: #FBBB2B; }
.merek i { width: 22px; height: 22px; border-radius: 50%; background: #FBBB2B; position: relative; display: inline-block; }
.merek i::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #13215A; }
h1 { margin: 10px 0 4px; font-size: 30px; line-height: 1.2; }
.atas p { margin: 0; color: #C8D1E8; max-width: 70ch; }

main { max-width: 1240px; margin: 0 auto; padding: 0 16px 56px; }
.alat { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 16px 0 12px; display: grid; gap: 12px; }
.baris-alat { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.label { font-size: 12px; font-weight: 700; color: var(--redup); }
.tema { display: inline-flex; background: var(--kartu); border: 1px solid var(--garis); border-radius: 999px; padding: 4px; gap: 4px; }
.tema label { position: relative; cursor: pointer; }
.tema input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.tema span { display: block; padding: 7px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; color: var(--redup); }
.tema input:checked + span { background: var(--navy); color: #fff; }
.tema input:focus-visible + span { outline: 3px solid var(--fokus); outline-offset: 2px; }
input[type=search] { flex: 1 1 260px; min-width: 0; border: 1px solid var(--garis); background: var(--kartu); color: var(--teks);
  border-radius: 999px; padding: 9px 16px; font: inherit; }
.kelompok-saring { display: flex; gap: 6px; flex-wrap: wrap; }
.kelompok-saring button { border: 1px solid var(--garis); background: var(--kartu); color: var(--redup); border-radius: 999px;
  padding: 5px 12px; font: 700 12px/1.4 "Poppins", sans-serif; cursor: pointer; }
.kelompok-saring button[aria-pressed="true"] { background: var(--kuning); border-color: var(--kuning); color: #13215A; }

h2 { font-size: 18px; margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
h2 span { font-size: 12px; font-weight: 700; color: var(--redup); background: var(--sorot); border-radius: 999px; padding: 2px 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 16px; }
.kartu { background: var(--kartu); border: 1px solid var(--garis); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.sampul { aspect-ratio: 16 / 11.25; background: var(--sorot); display: block; width: 100%; object-fit: cover; border-bottom: 1px solid var(--garis); }
.isi { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.isi h3 { margin: 0; font-size: 16px; line-height: 1.3; }
.meta { font-size: 12px; color: var(--redup); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.meta a { color: var(--redup); }
.unduh { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; padding-top: 6px; }
.tombol { display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; border-radius: 12px;
  padding: 8px 6px; font-weight: 700; font-size: 13px; line-height: 1.25; border: 1px solid transparent; }
.tombol small { font-weight: 400; font-size: 11px; opacity: .8; }
.tombol.pptx { background: var(--aksen); color: var(--aksen-teks); }
.tombol.pdf { background: var(--pdf-bg); color: var(--pdf-teks); border-color: #FBBB2B; }
.tombol[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.kosong { padding: 40px 0; text-align: center; color: var(--redup); }
footer { max-width: 1240px; margin: 0 auto; padding: 0 16px 32px; font-size: 12px; color: var(--samar); }
</style>
</head>
<body>
<header class="atas"><div class="atas-isi">
  <div class="merek"><i aria-hidden="true"></i>Cerebrum · Materi SKD</div>
  <h1 id="judul">Materi TIU Verbal</h1>
  <p id="ringkas">Pilih tampilan, lalu unduh materi dalam PPTX atau PDF.</p>
</div></header>
<main>
  <div class="alat">
    <div class="baris-alat">
      <span class="label" id="label-tema">Tampilan</span>
      <div class="tema" role="radiogroup" aria-labelledby="label-tema" id="pilih-tema"></div>
      <input type="search" id="cari" placeholder="Cari materi…" aria-label="Cari materi">
    </div>
    <div class="kelompok-saring" id="kelompok" role="group" aria-label="Saring kelompok"></div>
  </div>
  <div id="daftar"></div>
</main>
<footer id="kaki"></footer>

<script src="data.js"></script>
<script>
(() => {
  const D = window.MATERI;
  const $ = (id) => document.getElementById(id);
  const baca = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const tulis = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const mb = (b) => b == null ? "" : (b >= 1e6 ? (b / 1e6).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB");
  if (!D) { $("daftar").innerHTML = '<p class="kosong">data.js tidak ditemukan. Jalankan generator/buat_situs.py.</p>'; return; }

  let tema = D.tema.some((t) => t.id === baca("situs.tema")) ? baca("situs.tema") : D.tema[0].id;
  let kelompok = "";
  $("judul").textContent = D.judul;
  $("ringkas").textContent = `${D.materi.length} materi dalam ${D.tema.length} pilihan tampilan. Pilih tampilan, lalu unduh PPTX atau PDF.`;
  const tgl = new Date(D.dibuat + "T00:00:00").toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
  $("kaki").textContent = `Diperbarui ${tgl}. © PT Cerebrum Edukanesia Nusantara.`;

  D.tema.forEach((t) => {
    const lab = document.createElement("label");
    const inp = document.createElement("input");
    inp.type = "radio"; inp.name = "tema"; inp.value = t.id; inp.checked = t.id === tema;
    inp.addEventListener("change", () => { tema = t.id; tulis("situs.tema", tema); gambar(); });
    const s = document.createElement("span"); s.textContent = t.nama;
    lab.append(inp, s); $("pilih-tema").append(lab);
  });
  const daftarKelompok = [...new Set(D.materi.map((m) => m.kelompok))];
  ["", ...daftarKelompok].forEach((k) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = k || "Semua";
    b.addEventListener("click", () => { kelompok = k; gambar(); });
    $("kelompok").append(b);
  });
  $("cari").addEventListener("input", () => gambar());

  function tombol(jenis, t) {
    const a = document.createElement("a");
    a.className = "tombol " + jenis;
    a.href = t[jenis];
    a.download = t.nama + "." + jenis;
    const ukuran = t["ukuran_" + jenis];
    if (ukuran == null) a.setAttribute("aria-disabled", "true");
    a.innerHTML = `Unduh ${jenis.toUpperCase()}<small></small>`;
    a.querySelector("small").textContent = ukuran == null ? "belum tersedia" : mb(ukuran);
    return a;
  }

  function gambar() {
    [...$("kelompok").children].forEach((b, i) => b.setAttribute("aria-pressed", String((i === 0 ? "" : daftarKelompok[i - 1]) === kelompok)));
    const cari = $("cari").value.trim().toLowerCase();
    const cocok = D.materi.filter((m) => (!kelompok || m.kelompok === kelompok) &&
      (!cari || (m.judul + " " + m.bab + " " + m.kelompok).toLowerCase().includes(cari)));
    const wadah = $("daftar"); wadah.replaceChildren();
    if (!cocok.length) { wadah.innerHTML = '<p class="kosong">Tidak ada materi yang cocok.</p>'; return; }
    for (const k of daftarKelompok) {
      const isi = cocok.filter((m) => m.kelompok === k);
      if (!isi.length) continue;
      const h = document.createElement("h2"); h.textContent = k;
      const n = document.createElement("span"); n.textContent = `${isi.length} materi`; h.append(n);
      const grid = document.createElement("div"); grid.className = "grid";
      for (const m of isi) {
        const t = m.tema[tema];
        const kartu = document.createElement("article"); kartu.className = "kartu";
        const img = document.createElement("img");
        img.className = "sampul"; img.loading = "lazy"; img.alt = `Sampul ${m.judul} (${tema === "general" ? "General" : "Opsi B"})`;
        img.src = t.sampul;
        img.onerror = () => { img.removeAttribute("src"); };
        const isiKartu = document.createElement("div"); isiKartu.className = "isi";
        const h3 = document.createElement("h3"); h3.textContent = m.judul;
        const meta = document.createElement("div"); meta.className = "meta";
        meta.append(`${t.slide} slide`);
        if (m.dokumen) { const a = document.createElement("a"); a.href = m.dokumen; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Dokumen sumber ↗"; meta.append(" · ", a); }
        const unduh = document.createElement("div"); unduh.className = "unduh";
        unduh.append(tombol("pptx", t), tombol("pdf", t));
        isiKartu.append(h3, meta, unduh);
        kartu.append(img, isiKartu);
        grid.append(kartu);
      }
      wadah.append(h, grid);
    }
  }
  gambar();
})();
</script>
</body>
</html>
